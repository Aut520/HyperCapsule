name: Build and Release

# main push → auto bump version, tag vX.Y.Z, build, release
# tag push v* → build that tag and release
# Version-bump commits use [skip ci] so they do not loop.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- Push to main: bump, tag, build, release ----
  auto-release:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bump version and tag
        id: ver
        run: |
          set -euo pipefail
          GRADLE=app/build.gradle.kts
          CODE=$(sed -n 's/.*versionCode = \([0-9]\+\).*/\1/p' "$GRADLE" | head -n1)
          NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' "$GRADLE" | head -n1)
          if [ -z "$CODE" ] || [ -z "$NAME" ]; then
            echo "Cannot parse version from $GRADLE" >&2
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$NAME"
          PATCH=${PATCH:-0}
          NEW_PATCH=$((PATCH + 1))
          NEW_CODE=$((CODE + 1))
          NEW_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"
          sed -i "s/versionCode = ${CODE}/versionCode = ${NEW_CODE}/" "$GRADLE"
          sed -i "s/versionName = \"${NAME}\"/versionName = \"${NEW_NAME}\"/" "$GRADLE"
          echo "Bumped ${NAME} (code ${CODE}) -> ${NEW_NAME} (code ${NEW_CODE})"
          echo "name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${NEW_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_NAME}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GRADLE"
          git commit -m "chore(release): ${NEW_NAME} [skip ci]"
          git push origin HEAD:main
          git tag -a "v${NEW_NAME}" -m "HyperCapsule ${NEW_NAME}"
          git push origin "v${NEW_NAME}"

      - name: Decode keystore
        env:
          APP_SIG_SERCET: ${{ secrets.APP_SIG_SERCET }}
        run: |
          if [ -z "$APP_SIG_SERCET" ]; then
            echo "Missing secret APP_SIG_SERCET" >&2
            exit 1
          fi
          printf '%s' "$APP_SIG_SERCET" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          HC_KEYSTORE: ${{ runner.temp }}/release.jks
          APP_PASSWD: ${{ secrets.APP_PASSWD }}
          APP_SIG_KEY_ALIAS: ${{ secrets.APP_SIG_KEY_ALIAS }}
          APP_SIG_PASSWD: ${{ secrets.APP_SIG_PASSWD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then
            echo "No release APK produced" >&2
            exit 1
          fi
          cp "$APK" HyperCapsule.apk
          ls -l HyperCapsule.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: HyperCapsule ${{ steps.ver.outputs.tag }}
          body: |
            自动构建发布 ${{ steps.ver.outputs.tag }}（versionCode ${{ steps.ver.outputs.code }}）

            commit: ${{ github.sha }}
          files: HyperCapsule.apk
          fail_on_unmatched_files: true

  # ---- Manual tag push: build and release that tag ----
  tag-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          APP_SIG_SERCET: ${{ secrets.APP_SIG_SERCET }}
        run: |
          if [ -z "$APP_SIG_SERCET" ]; then
            echo "Missing secret APP_SIG_SERCET" >&2
            exit 1
          fi
          printf '%s' "$APP_SIG_SERCET" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          HC_KEYSTORE: ${{ runner.temp }}/release.jks
          APP_PASSWD: ${{ secrets.APP_PASSWD }}
          APP_SIG_KEY_ALIAS: ${{ secrets.APP_SIG_KEY_ALIAS }}
          APP_SIG_PASSWD: ${{ secrets.APP_SIG_PASSWD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then
            echo "No release APK produced" >&2
            exit 1
          fi
          cp "$APK" HyperCapsule.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HyperCapsule ${{ github.ref_name }}
          files: HyperCapsule.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ---- workflow_dispatch: build artifact only ----
  manual-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          APP_SIG_SERCET: ${{ secrets.APP_SIG_SERCET }}
        run: |
          if [ -z "$APP_SIG_SERCET" ]; then
            echo "Missing secret APP_SIG_SERCET" >&2
            exit 1
          fi
          printf '%s' "$APP_SIG_SERCET" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          HC_KEYSTORE: ${{ runner.temp }}/release.jks
          APP_PASSWD: ${{ secrets.APP_PASSWD }}
          APP_SIG_KEY_ALIAS: ${{ secrets.APP_SIG_KEY_ALIAS }}
          APP_SIG_PASSWD: ${{ secrets.APP_SIG_PASSWD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          cp "$APK" HyperCapsule.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperCapsule
          path: HyperCapsule.apk
