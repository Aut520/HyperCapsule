name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          APP_SIG_SERCET: ${{ secrets.APP_SIG_SERCET }}
        run: |
          if [ -z "$APP_SIG_SERCET" ]; then
            echo "Missing secret APP_SIG_SERCET" >&2
            exit 1
          fi
          printf '%s' "$APP_SIG_SERCET" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          HC_KEYSTORE: ${{ runner.temp }}/release.jks
          APP_PASSWD: ${{ secrets.APP_PASSWD }}
          APP_SIG_KEY_ALIAS: ${{ secrets.APP_SIG_KEY_ALIAS }}
          APP_SIG_PASSWD: ${{ secrets.APP_SIG_PASSWD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then
            echo "No release APK produced" >&2
            exit 1
          fi
          cp "$APK" HyperCapsule.apk
          ls -l HyperCapsule.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperCapsule
          path: HyperCapsule.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: HyperCapsule ${{ github.ref_name }}
          files: HyperCapsule.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
