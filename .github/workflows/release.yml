name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          APP_SIG_SERCET: ${{ secrets.APP_SIG_SERCET }}
        run: |
          if [ -z "$APP_SIG_SERCET" ]; then
            echo "Missing secret APP_SIG_SERCET" >&2
            exit 1
          fi
          printf '%s' "$APP_SIG_SERCET" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build release APK
        env:
          HC_KEYSTORE: ${{ runner.temp }}/release.jks
          APP_PASSWD: ${{ secrets.APP_PASSWD }}
          APP_SIG_KEY_ALIAS: ${{ secrets.APP_SIG_KEY_ALIAS }}
          APP_SIG_PASSWD: ${{ secrets.APP_SIG_PASSWD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then
            echo "No release APK produced" >&2
            exit 1
          fi
          cp "$APK" HyperCapsule.apk
          ls -l HyperCapsule.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperCapsule
          path: HyperCapsule.apk

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="$RUNNER_TEMP/release-body.md"
          {
            echo "## 更新说明"
            echo ""
          } > "$NOTES_FILE"

          extract_section() {
            tag="$1"
            file="$2"
            [ -f "$file" ] || return 1
            # Prefer "## v1.0.8" / "## [v1.0.8]" headings until the next ## heading.
            awk -v tag="$tag" '
              BEGIN { p = 0 }
              /^##/ {
                if (p == 1) exit
                line = $0
                gsub(/[\[\]*`]/, "", line)
                if (index(line, tag) > 0) { p = 1; next }
              }
              p == 1 { print }
            ' "$file"
          }

          SECTION="$(extract_section "$TAG" ".github/CHANGELOG.md")"
          if [ -z "$SECTION" ] && [ -f "CHANGELOG.md" ]; then
            SECTION="$(extract_section "$TAG" "CHANGELOG.md")"
          fi
          if [ -z "$SECTION" ]; then
            # Tag annotation message, if present.
            SECTION="$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null | sed '/^$/d')"
          fi
          if [ -z "$SECTION" ]; then
            SECTION="暂无手工更新说明，详见下方自动提交记录。"
          fi
          printf '%s\n' "$SECTION" >> "$NOTES_FILE"
          {
            echo ""
            echo "---"
            echo ""
            echo "## 提交记录"
            echo ""
          } >> "$NOTES_FILE"

          # Include commit subjects since the previous v* tag when possible.
          PREV_TAG="$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)"
          if [ -n "$PREV_TAG" ]; then
            echo "变更自 \`${PREV_TAG}\`：" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            git log --pretty=format:'- %s (%h)' "${PREV_TAG}..${TAG}" >> "$NOTES_FILE" || true
            echo "" >> "$NOTES_FILE"
          else
            git log --pretty=format:'- %s (%h)' -n 30 "$TAG" >> "$NOTES_FILE" || true
            echo "" >> "$NOTES_FILE"
          fi

          echo "Prepared release body at $NOTES_FILE"
          cat "$NOTES_FILE"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: HyperCapsule ${{ github.ref_name }}
          files: HyperCapsule.apk
          body_path: ${{ runner.temp }}/release-body.md
          # body_path already contains 更新说明 + 提交记录; still ask GitHub for
          # the "Full Changelog" compare link when available.
          generate_release_notes: true
          fail_on_unmatched_files: true
